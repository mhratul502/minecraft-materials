<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Castle 2 Items Tracker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f1ec;--card:#fff;--tx:#1f2421;--mut:#6b726d;--line:#dcd8cf;--acc:#3f8f4f;--acc2:#2d6a3a;--bar:#e4e1d8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16191a;--card:#1f2425;--tx:#e8ece9;--mut:#939b95;--line:#2f3637;--acc:#5fbf72;--acc2:#4aa85d;--bar:#2b3233}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16191a;--card:#1f2425;--tx:#e8ece9;--mut:#939b95;--line:#2f3637;--acc:#5fbf72;--acc2:#4aa85d;--bar:#2b3233}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--line);z-index:5}
h1{font-size:18px;margin:0 0 6px}
.bar{height:10px;background:var(--bar);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.sum{color:var(--mut);font-size:13px;margin:4px 0 8px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
input[type=search]{flex:1;min-width:140px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.chips button{white-space:nowrap;padding:4px 10px;border-radius:999px;font-size:13px}
main{padding:10px 14px 40px;max-width:760px;margin:auto}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:18px 0 6px}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:6px}
.row.done{opacity:.55}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nm{font-weight:600}
.note{color:var(--mut);font-size:12.5px}
.cnt{display:flex;align-items:center;gap:4px;white-space:nowrap}
.cnt input{width:78px;text-align:right;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
.mini{height:6px;background:var(--bar);border-radius:4px;margin:8px 0;overflow:hidden}
.mini>i{display:block;height:100%;background:var(--acc)}
.btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btns button{padding:3px 9px;font-size:13px}
.stk{color:var(--mut);font-size:12.5px;margin-left:auto}
</style>
</head>
<body>
<header>
<h1>🏰 Castle 2 · Items to craft</h1>
<div class="bar"><i id="pb"></i></div>
<div class="sum" id="sum"></div>
<div class="note" style="margin-bottom:6px">Needs of 30 or more are counted in stacks, rounded up (2 stacks + a few = 3 stacks). Under 30 is counted in single items.</div>
<div class="tools">
<input type="search" id="q" placeholder="Search materials…">
<button id="hide">Hide done</button>
<button id="theme">Theme</button>
<button id="reset">Reset</button>
</div>
<div class="chips" id="chips"></div>
</header>
<main id="list"></main>
<script>
const D=[
["Deepslate & stone", "Deepslate Bricks", 2275, "Stonecutter"],
["Deepslate & stone", "Cobbled Deepslate", 823, "Mine it"],
["Deepslate & stone", "Deepslate Brick Stairs", 357, "Stonecutter"],
["Deepslate & stone", "Deepslate Brick Wall", 226, "Stonecutter"],
["Deepslate & stone", "Cobbled Deepslate Stairs", 151, "Stonecutter"],
["Deepslate & stone", "Deepslate Brick Slab", 128, "Stonecutter"],
["Deepslate & stone", "Cobbled Deepslate Slab", 39, "Stonecutter"],
["Deepslate & stone", "Deepslate Tiles", 11, "Stonecutter"],
["Deepslate & stone", "Deepslate Tile Stairs", 6, "Stonecutter"],
["Deepslate & stone", "Andesite", 14, "Mine it"],
["Deepslate & stone", "Andesite Stairs", 14, "Stonecutter"],
["Deepslate & stone", "Andesite Slab", 4, "Stonecutter"],
["Deepslate & stone", "Andesite Wall", 1, "Stonecutter"],
["Deepslate & stone", "Polished Andesite", 6, "Stonecutter"],
["Deepslate & stone", "Polished Andesite Slab", 7, "Stonecutter"],
["Deepslate & stone", "Polished Andesite Stairs", 1, "Stonecutter"],
["Mangrove wood", "Mangrove Planks", 509, "From logs"],
["Mangrove wood", "Mangrove Fence", 377, "Planks + sticks"],
["Mangrove wood", "Mangrove Slab", 337, "Craft"],
["Mangrove wood", "Mangrove Stairs", 256, "Craft"],
["Mangrove wood", "Mangrove Trapdoor", 127, "Craft"],
["Mangrove wood", "Mangrove Log", 88, "Chop"],
["Mangrove wood", "Stripped Mangrove Log", 16, "Axe on a log"],
["Mangrove wood", "Mangrove Sign", 14, "Planks + stick"],
["Mangrove wood", "Mangrove Door", 13, "Craft"],
["Mangrove wood", "Mangrove Button", 4, "1 plank each"],
["Wood & storage", "Bookshelf", 71, "Librarian, or craft"],
["Wood & storage", "Chest", 31, "8 planks each"],
["Wood & storage", "Barrel", 24, "Planks + slabs"],
["Wood & storage", "Ladder", 40, "Sticks"],
["Wood & storage", "Lectern", 6, "4 slabs + bookshelf"],
["Wood & storage", "Oak Log", 6, "Chop"],
["Wood & storage", "Scaffolding", 2, "Bamboo + string"],
["Wood & storage", "Crafting Table", 1, "Craft"],
["Wood & storage", "Cartography Table", 1, "Planks + paper"],
["Wood & storage", "Smithing Table", 1, "Planks + iron"],
["Lighting", "Torch", 82, "Coal + stick"],
["Lighting", "Lantern", 51, "Librarian, 1 emerald each"],
["Lighting", "Chain", 16, "Iron"],
["Lighting", "Red Candle", 23, "Librarian (master) or craft"],
["Lighting", "Campfire", 1, "Logs + coal + sticks"],
["Carpets, wool & hay", "Gray Carpet", 35, "Carpet duplicator"],
["Carpets, wool & hay", "Light Gray Carpet", 25, "Carpet duplicator"],
["Carpets, wool & hay", "Red Carpet", 9, "Carpet duplicator"],
["Carpets, wool & hay", "Gray Wool", 8, "Dye wool"],
["Carpets, wool & hay", "Light Gray Wool", 8, "Dye wool"],
["Carpets, wool & hay", "Red Banner", 1, "6 red wool + stick"],
["Carpets, wool & hay", "Red Bed", 1, "3 red wool + planks"],
["Carpets, wool & hay", "Hay Bale", 35, "9 wheat each"],
["Plants & decor", "Flower Pot", 25, "3 bricks each"],
["Plants & decor", "Flowering Azalea", 13, ""],
["Plants & decor", "Azalea", 9, ""],
["Plants & decor", "Spruce Leaves", 13, "Shears"],
["Plants & decor", "Grass Block", 6, "Silk Touch"],
["Plants & decor", "Spruce Sapling", 3, ""],
["Plants & decor", "Crimson Fungus", 3, "Nether"],
["Plants & decor", "Crimson Roots", 2, "Nether"],
["Plants & decor", "Sculk Catalyst", 11, "Silk Touch, deep dark"],
["Plants & decor", "Large Amethyst Bud", 5, "Silk Touch, geode"],
["Plants & decor", "Skeleton Skull", 2, "Charged creeper kill"],
["Plants & decor", "Cobweb", 1, "Shears or sword"],
["Workstations & metal", "Cauldron", 7, "7 iron each"],
["Workstations & metal", "Ender Chest", 5, "8 obsidian + ender eye"],
["Workstations & metal", "Enchanting Table", 2, "Book, 2 diamonds, 4 obsidian"],
["Workstations & metal", "Brewing Stand", 2, "Blaze rod + cobblestone"],
["Workstations & metal", "Smoker", 2, "Furnace + 4 logs"],
["Workstations & metal", "Stone Button", 2, "Stone"],
["Workstations & metal", "Stonecutter", 1, "Iron + 3 stone"],
["Workstations & metal", "Anvil", 1, "3 iron blocks + 4 ingots"],
["Workstations & metal", "Blast Furnace", 1, "Furnace + iron + smooth stone"],
["Workstations & metal", "Furnace", 1, "8 cobblestone"],
["Workstations & metal", "Grindstone", 1, "Sticks + slab + planks"]
];
const K="mcmats.castle2items.v1";
const SZ={"Ender pearl":16};
const U=D.map(d=>d[2]<30?1:(SZ[d[1]]||64));
const N=D.map((d,i)=>Math.ceil(d[2]/U[i]));
let S={};try{S=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}
let cat="All",hide=false,q="";
const $=id=>document.getElementById(id);
const cats=["All",...new Set(D.map(d=>d[0]))];
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function stk(i){if(U[i]===1)return "single items";const z=U[i];return "≈ "+D[i][2].toLocaleString()+" items"+(z!==64?" (stacks of "+z+")":"")}
function render(){
 $("chips").innerHTML=cats.map(c=>`<button class="${c===cat?"on":""}" data-c="${c}">${c}</button>`).join("");
 let tot=0,sum=0,dn=0;
 D.forEach((d,i)=>{const h=Math.min(S[i]||0,N[i]);tot++;sum+=h/N[i];if(h>=N[i])dn++});
 const pct=Math.round(sum/tot*100);
 $("pb").style.width=pct+"%";
 $("sum").textContent=pct+"% overall · "+dn+" of "+tot+" materials complete";
 $("hide").classList.toggle("on",hide);
 let html="",last="";
 D.forEach((d,i)=>{
  if(cat!=="All"&&d[0]!==cat)return;
  const h=S[i]||0,done=h>=N[i];
  if(hide&&done)return;
  if(q&&!(d[1]+" "+d[3]).toLowerCase().includes(q))return;
  if(d[0]!==last){html+=`<h2>${d[0]}</h2>`;last=d[0]}
  const p=Math.min(100,h/N[i]*100);
  html+=`<div class="row ${done?"done":""}"><div class="top"><div><div class="nm">${done?"✅ ":""}${d[1]}</div><div class="note">${d[3]}</div></div>
  <div class="cnt"><input type="number" min="0" inputmode="numeric" value="${h}" data-i="${i}"> / ${N[i]} ${U[i]===1?(N[i]>1?"items":"item"):(N[i]>1?"stacks":"stack")}</div></div>
  <div class="mini"><i style="width:${p}%"></i></div>
  <div class="btns"><button data-i="${i}" data-a="-1">−1</button><button data-i="${i}" data-a="1">+1</button><button data-i="${i}" data-a="10">+10</button><button data-i="${i}" data-a="full">Done</button><span class="stk">${stk(i)}</span></div></div>`;
 });
 $("list").innerHTML=html||'<p class="note">Nothing to show.</p>';
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.c){cat=b.dataset.c;render();return}
 if(b.dataset.a){const i=+b.dataset.i,a=b.dataset.a;
  S[i]=Math.max(0,a==="full"?N[i]:(S[i]||0)+ +a);save();render();}
});
document.addEventListener("change",e=>{
 if(e.target.dataset.i&&e.target.type==="number"){S[e.target.dataset.i]=Math.max(0,parseInt(e.target.value)||0);save();render()}
});
$("q").addEventListener("input",e=>{q=e.target.value.toLowerCase();render()});
$("hide").onclick=()=>{hide=!hide;render()};
$("reset").onclick=()=>{if(confirm("Reset all progress?")){S={};save();render()}};
$("theme").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};
render();
</script>
</body>
</html>
